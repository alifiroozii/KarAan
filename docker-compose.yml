version: "3.8"

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: karaan-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: karaan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: karaan-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2023-09-16T01-01-47Z
    container_name: karaan-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: karaan-app
    environment:
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/karaan
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadminpassword
      S3_BUCKET: karaan-uploads
      JWT_SECRET: karaan_production_jwt_secret_2026
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  minio_data:
