<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <title>کارآن | آفلاین</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}.card{width:min(480px,100%);border:1px solid #334155;background:#111827;border-radius:28px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.28)}.mark{width:54px;height:54px;border-radius:16px;background:#4f46e5;display:grid;place-items:center;font-weight:900;font-size:24px}.muted{color:#94a3b8;line-height:2;font-size:14px}.row{display:flex;align-items:center;gap:14px}.dot{width:9px;height:9px;border-radius:50%;background:#f59e0b;display:inline-block;margin-left:6px}.button{margin-top:18px;width:100%;border:0;border-radius:14px;background:#4f46e5;color:#fff;padding:12px 16px;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="row"><div class="mark">ک</div><div><strong>کارآن</strong><div class="muted"><span class="dot"></span>اتصال اینترنت در دسترس نیست</div></div></div>
    <h1>شما آفلاین هستید</h1>
    <p class="muted">برای امنیت حساب، اطلاعات شیفت، کیف پول، موقعیت و پیام‌ها به‌صورت آفلاین ذخیره نمی‌شوند. پس از برقراری اینترنت دوباره تلاش کنید.</p>
    <button class="button" type="button" onclick="location.reload()">تلاش مجدد</button>
  </main>
</body>
</html>
