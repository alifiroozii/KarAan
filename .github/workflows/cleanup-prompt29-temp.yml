name: Cleanup Prompt29 temporary workflows

on:
  push:
    branches:
      - agent/prompt-29-worker-relationships
    paths:
      - .github/workflows/cleanup-prompt29-temp.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prompt-29-worker-relationships
      - name: Remove temporary workflows
        shell: bash
        run: |
          git rm -f .github/workflows/patch-prompt29-live-controls.yml .github/workflows/cleanup-prompt29-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary Prompt29 workflows"
          git push origin HEAD:agent/prompt-29-worker-relationships
