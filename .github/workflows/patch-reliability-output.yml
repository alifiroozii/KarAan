name: Temporary reliability type patch

on:
  push:
    branches:
      - agent/prompt-27-reliability
    paths:
      - .github/workflows/patch-reliability-output.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prompt-27-reliability
      - name: Patch transaction output typing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/modules/reliability/reliability.service.ts')
          s = p.read_text()
          old = '''    if (!output) throw new AppError("Reliability mutation تکمیل نشد.", "INTERNAL_SERVER_ERROR", 500);\n    const finalOutput = output as NonNullable<typeof output>;'''
          new = '''    if (!output) throw new AppError("Reliability mutation تکمیل نشد.", "INTERNAL_SERVER_ERROR", 500);\n    const finalOutput = output as {\n      eventId: string;\n      previousScore: number;\n      resultingScore: number;\n      scoreDelta: number;\n      idempotent: boolean;\n      strikeId: string | null;\n      sanctionId: string | null;\n      sanctionType: string | null;\n    };'''
          if old not in s:
              raise SystemExit('expected block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/reliability/reliability.service.ts
          git commit -m "fix: stabilize reliability transaction output typing"
          git push origin HEAD:agent/prompt-27-reliability
